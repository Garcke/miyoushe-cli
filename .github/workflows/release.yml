name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...
      - working-directory: npm
        run: npm ci && npm test

  github-release:
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/mys_*/*
            dist/mys_*.tar.gz
            dist/mys_*.zip
            dist/checksums.txt

  npm-publish:
    # Enable only after the initial package is created on npm and this
    # workflow is registered as its trusted publisher.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: github-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Match package version to the Git tag
        shell: bash
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - working-directory: npm
        run: npm ci
      - working-directory: npm
        run: npm test
      - working-directory: npm
        run: npm publish --access public
